<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speak Daily">
<title>Speak Daily</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#F2F4F7;--card:#FFFFFF;--ink:#17212F;--sub:#5B6676;--line:#2E8B57;--now:#F0A500;--o:#2E8B57;--t:#E0A100;--x:#D64545;--rule:#D9DEE5;
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10151D;--card:#1A212C;--ink:#E8ECF1;--sub:#9AA5B4;--rule:#2A3340}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:16px 18px calc(96px + env(safe-area-inset-bottom,0px))}
header h1{font-size:14px;font-weight:600;color:var(--sub);margin:4px 0 2px}
header h2{font-size:24px;font-weight:800;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 10px}
.map{display:flex;align-items:flex-start;margin:6px 0 16px}
.st{flex:1;text-align:center;font-size:11px;color:var(--sub);position:relative}
.st::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:4px;background:var(--rule)}
.st:first-child::before{display:none}
.st.pass::before,.st.cur::before{background:var(--line)}
.st i{display:block;width:20px;height:20px;margin:0 auto 6px;border-radius:50%;background:var(--card);border:4px solid var(--rule);position:relative;z-index:1}
.st.pass i{border-color:var(--line);background:var(--line)}
.st.cur i{border-color:var(--now)}
.st.cur{color:var(--ink);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px}
.ko{font-size:19px;font-weight:700;line-height:1.5;margin:0}
.en{font-size:19px;line-height:1.5;margin-top:8px}
.muted{color:var(--sub);font-size:14px;line-height:1.6}
.sp{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
button{font:inherit;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;background:var(--rule);color:var(--ink)}
button.go{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.35}
button:focus-visible,a:focus-visible{outline:3px solid var(--now);outline-offset:2px}
.row{display:flex;gap:8px}.row button{flex:1;padding:14px 6px}
.bO{background:var(--o);color:#fff}.bT{background:var(--t);color:#1a1a1a}.bX{background:var(--x);color:#fff}
.line{padding:10px 12px;border-radius:10px;margin:4px 0}
.line.on{background:color-mix(in srgb,var(--now) 22%,transparent)}
.opt{text-align:left;font-weight:500;background:var(--bg)}
.opt.wrong{background:color-mix(in srgb,var(--x) 25%,transparent)}
.timer{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.count{font-size:13px;color:var(--sub);text-align:right;margin-bottom:6px}
label{display:block;margin-top:14px;font-weight:600}
.vbtn{width:auto;padding:8px 12px;font-size:13px;margin:0 0 12px}
input,select{font:inherit;font-size:18px;width:100%;padding:12px;border-radius:10px;border:2px solid var(--rule);background:var(--bg);color:var(--ink);margin-top:6px}
/* 홈 주간표 */
.wk{display:flex;gap:6px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.wk b{display:flex;align-items:center;justify-content:center;height:40px;border-radius:10px;background:var(--bg);font-size:15px;color:var(--sub);margin-bottom:4px}
.wk .done b{background:var(--line);color:#fff}
.wk .today b{outline:3px solid var(--now)}
.wk .miss b{background:color-mix(in srgb,var(--x) 20%,transparent)}
/* 분석 */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{background:var(--bg);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{width:auto;margin:0;padding:6px 10px;font-size:13px;font-weight:600;border-radius:999px}
.lv0{background:color-mix(in srgb,var(--x) 30%,transparent)}
.lv1,.lv2{background:color-mix(in srgb,var(--t) 35%,transparent)}
.lv3,.lv4{background:color-mix(in srgb,var(--o) 35%,transparent)}
.lvg{background:var(--o);color:#fff}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg);flex:1}
.bar i{display:block;height:100%}
.brow{display:flex;align-items:center;gap:10px;font-size:13px;margin:6px 0}
.brow span{width:64px;color:var(--sub);flex:none}
.brow em{font-style:normal;width:40px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--rule);font-size:15px}
.list li:first-child{border-top:0}
.chart{width:100%;height:120px}
/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tab{flex:1;text-align:center;padding:10px 0 12px;font-size:12px;color:var(--sub);text-decoration:none;font-weight:600}
.tab i{display:block;font-style:normal;font-size:20px;line-height:1.3}
.tab.on{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="view"><p class="muted">불러오는 중…</p></main>
<nav class="tabs" aria-label="메뉴">
  <a class="tab" data-r="home" href="#home"><i>🏠</i>홈</a>
  <a class="tab" data-r="learn" href="#learn"><i>🎧</i>학습</a>
  <a class="tab" data-r="review" href="#review"><i>🗂</i>기록</a>
  <a class="tab" data-r="stats" href="#stats"><i>📈</i>분석</a>
</nav>
<script src="js/core.js?v=5"></script>
<script src="js/learn.js?v=6"></script>
<script src="js/stats.js?v=5"></script>
<script>boot();</script>
</body>
</html>
