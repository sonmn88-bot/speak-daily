<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Speak Daily">
<meta name="theme-color" content="#F7F7F4">
<title>Speak Daily</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Archivo:wdth,wght@75..100,500..900&display=swap">
<style>
/* ===== Speak Daily · C 노선도 (Transit Light) — 규칙은 DESIGN.md ===== */
:root{
  --bg:#F7F7F4;--card:#FFFFFF;--deep:#EFEFEA;--raise:#E7E7E1;--ink:#151515;--sub:#62625C;--rule:#E0E0DA;--track:#D5D6D0;
  --now:#1E6B52;--on-now:#FFFFFF;--line:var(--now);--o:#1E6B52;--t:#9A6410;--x:#B8392A;--due:#F2C230;--mark:#BFE3D3;
  --now-12:rgba(30,107,82,.08);--now-24:rgba(30,107,82,.14);--o-24:rgba(30,107,82,.14);--x-24:rgba(184,57,42,.12);--t-24:rgba(242,194,48,.28);
  --r-s:4px;--r-m:6px;--r-l:8px;--r-pill:999px;--ease:cubic-bezier(.2,.8,.2,1);
  --kr:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;--en:Inter,Pretendard,-apple-system,sans-serif;--disp:Archivo,Inter,Pretendard,sans-serif;
  font-family:var(--kr);color:var(--ink);background:var(--bg);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:16px 18px calc(104px + env(safe-area-inset-bottom,0px));position:relative}
header h1{font-family:var(--disp);font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--sub);margin:6px 0 6px}
header h2{font-size:24px;font-weight:800;line-height:1.3;margin:0 0 12px;letter-spacing:-.01em}
.meta~.map{margin:2px 0 12px}
#view header:has(+.meta) h2{font-size:20px;margin-bottom:8px}
h3{font-size:16px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.ic{vertical-align:-3px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 12px}
.meta span{font-size:12px;font-weight:700;color:var(--sub);background:var(--deep);border-radius:var(--r-pill);padding:5px 10px}
.meta .vbtn{margin:0;min-height:44px;padding:8px 14px}

/* 카드와 글자 */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-l);padding:20px;margin-bottom:14px}
.ko{font-size:21px;font-weight:700;line-height:1.5;margin:0}
.en{font-family:var(--en);font-size:20px;font-weight:700;line-height:1.45;margin-top:8px}
.chunk{font-family:var(--disp);font-size:30px;font-weight:800;line-height:1.12;letter-spacing:-.02em;margin:0 0 4px;color:var(--now)}
.muted{color:var(--sub);font-size:14px;line-height:1.6}
.muted .ic{color:var(--sub)}
.sp{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:2px}
.count{font-family:var(--disp);font-size:12px;font-weight:700;color:var(--sub);text-align:right;margin-bottom:6px;letter-spacing:.04em}
.hl{color:var(--now);font-weight:800;background:none;padding:0}
.miss{color:var(--x);text-decoration:underline;text-underline-offset:3px}
.ok{color:var(--o);font-weight:700}
.gate{background:var(--deep);border-radius:var(--r-m);padding:10px 12px;color:var(--t)}
.resume{background:var(--deep);border-radius:var(--r-m);padding:10px 12px;color:var(--now)}

/* 버튼 */
button{font:inherit;border:0;border-radius:var(--r-m);padding:14px 16px;min-height:48px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;background:var(--raise);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
button.go{background:var(--now);color:var(--on-now);font-weight:800}button.go2{background:transparent;color:var(--now);box-shadow:inset 0 0 0 1.5px var(--now)}button.go2:disabled{opacity:.5}
button:disabled{opacity:.38;cursor:default}
button.go:disabled{opacity:1;background:var(--deep);color:var(--sub);box-shadow:inset 0 0 0 1px var(--rule)}
button.sel{background:var(--now-24);color:var(--now);box-shadow:inset 0 0 0 1px var(--now)}
.score{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 0;font-size:14px}
.sO{color:var(--o)}.sT{color:var(--t)}.sX{color:var(--x)}
.meta #qp{color:var(--x);background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--now);outline-offset:2px}
.row{display:flex;gap:8px}.row button{flex:1;padding:12px 6px;min-height:56px}
.grade button{flex-direction:column;gap:2px;font-size:18px}
.grade small{font-size:11px;font-weight:600;opacity:.85}
.bO{background:var(--o);color:var(--on-now)}
.bT{background:var(--t-24);color:var(--t)}
.bX{background:var(--x-24);color:var(--x)}
.vbtn{width:auto;min-height:44px;padding:10px 16px;font-size:13px;margin:0 0 12px;background:var(--deep);color:var(--sub);border-radius:var(--r-pill)}
.iconbtn{min-width:44px;min-height:44px;margin:0 0 0 4px;padding:0;display:inline-flex;vertical-align:middle}
.opt{justify-content:flex-start;text-align:left;font-weight:500;background:var(--deep);border:1px solid var(--rule)}
.opt.wrong{background:var(--x-24)}
.opt.right{background:var(--o-24)}
.opt .ok{flex:none;margin-left:auto;white-space:nowrap;padding-left:8px}

/* 대화 줄 */
.line{padding:10px 12px;border-radius:var(--r-m);margin:4px 0;font-family:var(--en)}
.line .muted,.line .sp{font-family:var(--kr)}
.line.on{background:var(--now-12)}

/* 진행 단계: 막대 + 현재 단계 이름 */
.map{display:flex;align-items:flex-start;gap:4px;margin:4px 0 18px}
.st{flex:1;font-size:0;color:var(--sub);min-width:0}
.st i{display:block;width:100%;height:4px;border-radius:2px;margin:0 0 6px;background:var(--rule)}
.st.pass i{background:var(--now)}
.st.cur i{background:var(--now);opacity:.45}
.st.cur{font-size:11px;font-weight:700;color:var(--now);white-space:nowrap;overflow:visible}

/* 입력 */
label{display:block;margin-top:14px;font-weight:600}
input,select,textarea{font:inherit;font-size:18px;width:100%;padding:12px;border-radius:var(--r-m);border:2px solid var(--rule);background:var(--deep);color:var(--ink);margin-top:6px}
#ty{font-family:var(--en)}
textarea{font-family:var(--en);resize:vertical}
.timer{font-family:var(--disp);font-size:72px;letter-spacing:-.03em;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}

/* 단어 조각 */
.chips,.ansline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ansline{min-height:52px;padding:8px;border-radius:var(--r-m);background:var(--deep);border:1px dashed var(--rule);align-items:center}
.chip{width:auto;margin:0;padding:10px 12px;min-height:44px;min-width:44px;font-family:var(--en);font-size:16px;font-weight:600;border-radius:var(--r-m);background:var(--raise)}
.chip.on{background:var(--now);color:var(--on-now)}

/* 홈 주간표 */
.wk{display:flex;gap:6px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--sub)}
.wk b{display:flex;align-items:center;justify-content:center;height:40px;border-radius:var(--r-s);background:var(--deep);font-size:15px;color:var(--sub);margin-bottom:4px}
.wk .done b{background:var(--now);color:var(--on-now)}
.wk .today b{outline:3px solid var(--now);outline-offset:-3px;color:var(--ink)}
.hbtn{position:absolute;top:14px;right:14px;color:var(--sub);background:none;border:0;padding:10px;width:auto;margin:0;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none}.hbtn.o{right:62px}details.hp{border-top:1px solid var(--rule);padding:12px 0}details.hp summary{font-weight:700;cursor:pointer;min-height:32px;list-style-position:inside}details.hp p,details.hp li{color:var(--sub);line-height:1.7;margin:6px 0}.gear{position:absolute;top:14px;right:14px;color:var(--sub);text-decoration:none;padding:10px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}

/* 분석 */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{background:var(--deep);border-radius:var(--r-m);padding:12px}
.kpi b{display:block;font-family:var(--en);font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{width:auto;margin:0;padding:8px 12px;min-height:40px;font-size:13px;font-weight:600;border-radius:var(--r-pill)}
.lv0{background:var(--x-24)}
.lv1,.lv2{background:var(--t-24)}
.lv3,.lv4{background:var(--o-24)}
.lvg{background:var(--o);color:var(--on-now)}
.bar{display:flex;height:12px;border-radius:var(--r-s);overflow:hidden;background:var(--deep);flex:1}
.bar i{display:block;height:100%}
.brow{display:flex;align-items:center;gap:10px;font-size:13px;margin:6px 0}
.brow span{width:88px;color:var(--sub);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow em{font-style:normal;width:44px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--rule);font-size:15px}
.list .pill{min-height:0;line-height:1.6;vertical-align:middle}
.list li:first-child{border-top:0}
.chart{width:100%;height:120px}
.radio-now{min-height:130px}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;min-height:56px;font-size:11px;color:var(--sub);text-decoration:none;font-weight:600}
.tab.on{color:var(--now)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{width:auto;margin:0;min-height:44px;padding:8px 14px;font-size:15px;font-weight:600;border-radius:var(--r-pill);background:var(--deep);font-family:var(--en);flex-direction:row}ol.flow{margin:6px 0 0 20px;padding:0;line-height:1.8}.cue{display:inline-block;font-size:12px;font-weight:700;color:var(--now);background:var(--deep);border-radius:var(--r-pill);padding:3px 10px;margin-bottom:8px}
body,p,h1,h2,h3,li,.ko,.muted,button{word-break:keep-all;overflow-wrap:break-word}
button,a.tab,.opt,.chip{transition:transform .12s var(--ease),background-color .15s var(--ease),box-shadow .15s var(--ease),opacity .15s var(--ease)}
button:active:not(:disabled),.opt:active:not(:disabled){transform:scale(.98)}
.pill,.chips .chip{min-height:44px}

/* 홈 (C 노선도: 주차 배지 · 노선 진도 · 오늘 표현 카드 · 선 목록) */
.wkhead{display:flex;align-items:center;gap:12px;margin:10px 0 0;min-height:48px}
.wbadge{flex:none;width:44px;height:44px;border-radius:50%;background:var(--now);color:var(--on-now);display:grid;place-items:center;font-family:var(--disp);font-stretch:80%;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.wkhead .wt{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:13px;color:var(--sub);line-height:1.4}.wkhead .wt b{font-size:16px;color:var(--ink)}
.route{position:relative;display:flex;justify-content:space-between;margin:22px 4px 0;padding:0;list-style:none}
.route::before,.route::after{content:"";position:absolute;left:10px;right:10px;top:8px;height:4px;background:var(--track)}
.route::after{right:auto;width:calc((100% - 20px) * var(--p,0));background:var(--now)}
.route li{position:relative;z-index:1;width:20px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--disp);font-size:11px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.route li i{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid var(--track)}
.route li.pass i{border-color:var(--now)}
.route li.cur i{background:var(--now);border-color:var(--now);box-shadow:0 0 0 3px var(--bg)}
.route li.cur{color:var(--now);font-weight:800}
.hcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-l);padding:22px 18px 18px;margin:22px 0 0}
.eyebrow{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--now);margin:0 0 8px}
.hero{font-family:var(--disp);font-stretch:78%;font-size:52px;font-weight:800;line-height:1;letter-spacing:-.01em;margin:0 0 14px;word-break:normal;overflow-wrap:anywhere}
.hero.m{font-size:44px}.hero.s{font-size:36px;line-height:1.04}
.hero em{font-style:normal;background:linear-gradient(transparent 62%,var(--mark) 62%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero.ko-hero{font-family:var(--kr);font-stretch:100%;font-size:32px;letter-spacing:-.01em;line-height:1.3}
.hero-sub{font-size:16px;line-height:1.6;color:var(--sub);margin:0 0 12px}.hero-sub b{color:var(--ink)}
.hmeta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 4px;font-size:14px;color:var(--sub)}
.hmeta span{font-family:var(--en);font-weight:600;color:var(--ink)}
button.go.big{min-height:60px;border-radius:var(--r-m);justify-content:space-between;padding:0 20px;font-size:17px;margin-top:14px}
.go.big .arr{font-family:var(--disp);font-size:22px;font-weight:600}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule);margin:18px 0 6px}
.stats3 div{padding:16px 0 14px;border-left:1px solid var(--rule);padding-left:14px}.stats3 div:first-child{border-left:0;padding-left:0}
.stats3 b{display:block;font-family:var(--disp);font-stretch:80%;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stats3 small{font-size:12px;color:var(--sub)}
.sec{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:30px 0 2px}
button.lrow,.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin:0;padding:16px 0;min-height:64px;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;text-align:left;color:var(--ink)}
.lrow .lt{display:flex;flex-direction:column;gap:3px;min-width:0}.lrow .lt b{font-size:17px;font-weight:700}.lrow .lt small{font-size:13px;font-weight:500;color:var(--sub);line-height:1.5}
.lrow .lm{font-family:var(--disp);font-size:15px;font-weight:600;color:var(--now);flex:none}.lrow.t .lm{color:var(--ink);background:var(--due);border-radius:3px;padding:3px 7px;font-size:11px;font-weight:800;letter-spacing:.04em}
.lrow-wrap{position:relative}.lrow-wrap .lrow{padding-right:48px}
.lrow-wrap .x{position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:44px;min-height:44px;margin:0;padding:0;background:none;color:var(--sub)}
.lrow-wrap .lrow .lm{display:none}
.seg{gap:6px}.seg button{margin-top:8px}.seg button.sel{background:var(--ink);color:var(--card);box-shadow:none}
</style>
</head>
<body>
<main id="view"><p class="muted">불러오는 중…</p></main>
<nav class="tabs" aria-label="메뉴">
  <a class="tab" data-r="home" href="#home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>홈</a>
  <a class="tab" data-r="learn" href="#learn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/></svg>학습</a>
  <a class="tab" data-r="review" href="#review"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>기록</a>
  <a class="tab" data-r="stats" href="#stats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>분석</a>
</nav>
<script src="js/core.js?v=15"></script>
<script src="js/learn.js?v=13"></script>
<script src="js/stats.js?v=16"></script>
<script src="js/persona.js?v=6"></script>
<script>boot();</script>
</body>
</html>
